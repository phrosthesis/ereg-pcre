name: Tests

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php-version: [
          '7.0', '7.1', '7.2', '7.3', '7.4',
          '8.0', '8.1', '8.2', '8.3', '8.4', '8.5', '8.6',
        ]

    name: PHP ${{ matrix.php-version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          extensions: pcre
          coverage: xdebug
          tools: composer

      - name: Composer install
        uses: ramsey/composer-install@v4

      - name: Download tests runner
        run: curl -sO 'https://raw.githubusercontent.com/php/php-src/PHP-${{ matrix.php-version }}/run-tests.php'

      - name: Run tests
        run: php run-tests.php -q --no-progress -d auto_prepend_file=vendor/autoload.php
